<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whac-A-Troy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, button, span, h1, p, input {
            font-family: 'Comic Sans MS', 'Comic Sans', cursive, sans-serif !important;
        }
        body {
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #09090b;
            min-height: 100vh;
        }
        .cabinet-shadow {
            box-shadow: 0 0 50px rgba(79, 70, 229, 0.4), inset 0 0 30px rgba(0, 0, 0, 0.8);
        }
        @keyframes popUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(0%); }
        }
        .mole-up {
            animation: popUp 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .hammer-active {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewport='0 0 100 100' style='fill:black;font-size:30px;'><text y='30'>🔨</text></svg>"), auto !important;
        }
    </style>
</head>
<body class="text-white flex flex-col items-center justify-center p-4">

    <!-- Main Arcade Cabinet Container -->
    <div class="w-full max-w-xl bg-slate-900/95 backdrop-blur-md border-4 border-indigo-500 rounded-3xl cabinet-shadow p-6 sm:p-8 flex flex-col items-center relative overflow-hidden">
        
        <!-- Top Arcade Marquee -->
        <div class="text-center mb-4 w-full border-b-2 border-indigo-500/40 pb-4">
            <h1 class="text-2xl sm:text-3xl text-yellow-400 font-extrabold tracking-wider drop-shadow-[0_2px_10px_rgba(234,179,8,0.5)]">
                WHAC-A-TROY
            </h1>
        </div>

        <!-- Scoreboard / HUD (Score, Lives, High Score) -->
        <div class="grid grid-cols-3 gap-2 sm:gap-4 w-full mb-6 text-center">
            <div class="bg-slate-800 border-2 border-slate-700 rounded-xl p-3 shadow-inner">
                <span class="block text-xs text-slate-400 uppercase mb-1">Score</span>
                <span id="scoreDisplay" class="text-xl sm:text-2xl text-green-400 font-bold">0</span>
            </div>
            <div class="bg-slate-800 border-2 border-slate-700 rounded-xl p-3 shadow-inner">
                <span class="block text-xs text-slate-400 uppercase mb-1">Lives</span>
                <span id="livesDisplay" class="text-xl sm:text-2xl text-red-500 font-bold">❤️❤️❤️</span>
            </div>
            <div class="bg-slate-800 border-2 border-slate-700 rounded-xl p-3 shadow-inner">
                <span class="block text-xs text-slate-400 uppercase mb-1">High Score</span>
                <span id="highScoreDisplay" class="text-xl sm:text-2xl text-purple-400 font-bold">0</span>
            </div>
        </div>

        <!-- Audio Elements -->
        <audio id="ouchAudio" src="ouch.mp3" preload="auto"></audio>
        <audio id="bgMusic" src="bg.mp3" loop preload="auto"></audio>
        <audio id="gameOverAudio" src="igyo.mp3" preload="auto"></audio>

        <!-- Game Grid (3x3 Holes) with bg2.png background -->
        <div id="gameGrid" class="grid grid-cols-3 gap-3 sm:gap-4 w-full max-w-md aspect-square p-4 rounded-2xl border-4 border-slate-800 shadow-2xl relative bg-cover bg-center" style="background-image: url('bg2.png'); background-color: #020617;">
            <!-- 9 Holes generated via JS -->
        </div>

        <!-- Controls & Start Button -->
        <div class="mt-6 w-full max-w-md flex flex-col items-center">
            <button id="startBtn" class="w-full py-4 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-extrabold text-base sm:text-lg rounded-xl shadow-lg transform active:scale-95 transition-all duration-150 border-b-4 border-amber-800 cursor-pointer">
                START GAME
            </button>
        </div>

        <!-- Game Over / Score Screen Modal Overlay -->
        <div id="modalOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md hidden flex flex-col items-center justify-center p-6 z-50 text-center overflow-y-auto">
            <div class="bg-slate-900 border-2 border-indigo-500 p-6 rounded-2xl max-w-md w-full shadow-2xl my-auto">
                <h3 id="modalTitle" class="text-xl sm:text-2xl text-yellow-400 mb-2 font-bold">GAME OVER</h3>
                <p id="finalScoreText" class="text-slate-200 text-base mb-4 font-semibold">You whacked Troy 0 times!</p>
                
                <!-- Name Submission Form -->
                <div id="submitSection" class="mb-5 flex flex-col gap-3">
                    <input type="text" id="playerNameInput" placeholder="Enter Your Name" maxlength="15" class="w-full px-4 py-3 bg-slate-800 border-2 border-slate-700 rounded-xl text-white text-center focus:outline-none focus:border-yellow-400 font-bold" />
                    <button id="submitScoreBtn" class="w-full py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded-xl text-sm transition-all shadow-md cursor-pointer">
                        SUBMIT TO GLOBAL LEADERBOARD
                    </button>
                </div>

                <!-- Global Leaderboard Table -->
                <div class="mb-5">
                    <h4 class="text-sm text-yellow-400 uppercase tracking-wider mb-2 font-bold">🌍 Global Top 10</h4>
                    <div id="leaderboardList" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-left text-xs sm:text-sm max-h-36 overflow-y-auto space-y-1">
                        <div class="text-slate-400 text-center py-2">Loading leaderboard...</div>
                    </div>
                </div>

                <button id="modalBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-sm transition-all shadow-md cursor-pointer">
                    PLAY AGAIN
                </button>
            </div>
        </div>

    </div>

    <!-- Firebase SDK & Game Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, query, orderByChild, limitToLast, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD6jWFraCDGLyYBlxMzWa3JcmMZSYpHghI",
            authDomain: "whacatroyleaderboard.firebaseapp.com",
            databaseURL: "https://whacatroyleaderboard-default-rtdb.firebaseio.com",
            projectId: "whacatroyleaderboard",
            storageBucket: "whacatroyleaderboard.firebasestorage.app",
            messagingSenderId: "562825000747",
            appId: "1:562825000747:web:b4c084f7dbce160767776e",
            measurementId: "G-EJ7RL3NHBB"
        };

        let db = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
        } catch (e) {
            console.log("Database connection error:", e);
        }

        // Web Audio API Boost setup for 5x volume on igyo.mp3
        let audioCtx = null;
        let gameOverGain = null;
        function initAudioBoost() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const source = audioCtx.createMediaElementSource(gameOverAudio);
                    gameOverGain = audioCtx.createGain();
                    gameOverGain.gain.value = 5.0;
                    source.connect(gameOverGain);
                    gameOverGain.connect(audioCtx.destination);
                } catch (e) {
                    console.log("Web Audio API boost fallback:", e);
                }
            } else if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Game DOM Elements
        const grid = document.getElementById('gameGrid');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const startBtn = document.getElementById('startBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const finalScoreText = document.getElementById('finalScoreText');
        const modalBtn = document.getElementById('modalBtn');
        const playerNameInput = document.getElementById('playerNameInput');
        const submitScoreBtn = document.getElementById('submitScoreBtn');
        const leaderboardList = document.getElementById('leaderboardList');
        const submitSection = document.getElementById('submitSection');
        const bgMusic = document.getElementById('bgMusic');
        const gameOverAudio = document.getElementById('gameOverAudio');

        let score = 0;
        let lives = 3;
        let isPlaying = false;
        let lastHole = null;
        let currentMoleHole = null;
        let popTimer = null;
        let moleTimeout = null;
        let currentPopDuration = 4000; // Starts at 4 seconds

        // Load High Score from Local Storage
        let highScore = localStorage.getItem('whac_troy_arcade_highScore') || 0;
        highScoreDisplay.textContent = highScore;

        // Initialize 9 holes
        const holes = [];
        for (let i = 0; i < 9; i++) {
            const hole = document.createElement('div');
            hole.classList.add('relative', 'bg-slate-900/60', 'backdrop-blur-xs', 'rounded-2xl', 'overflow-hidden', 'border-4', 'border-slate-800/80', 'flex', 'items-end', 'justify-center', 'cursor-pointer', 'shadow-inner');
            
            const mole = document.createElement('div');
            mole.classList.add('w-20', 'h-20', 'sm:w-24', 'sm:h-24', 'absolute', 'bottom-0', 'transform', 'translate-y-full', 'transition-transform', 'duration-150', 'flex', 'items-center', 'justify-center', 'z-20');
            
            const troyFace = document.createElement('div');
            troyFace.classList.add('w-full', 'h-full', 'flex', 'items-center', 'justify-center', 'overflow-hidden', 'rounded-full', 'shadow-2xl', 'bg-slate-800');
            troyFace.innerHTML = `<img src="troy.png" class="w-full h-full object-cover rounded-full" alt="Troy" onerror="this.onerror=null; this.src='https://placehold.co/100x100/1e293b/facc15?text=Troy';" />`;
            
            mole.appendChild(troyFace);

            // Whack event listener
            const handleWhack = (e) => {
                e.preventDefault();
                if (!isPlaying || currentMoleHole !== i) return;
                
                score++;
                scoreDisplay.textContent = score;
                
                // Play ouch audio effect
                const ouchAudio = document.getElementById('ouchAudio');
                if (ouchAudio) {
                    ouchAudio.currentTime = 0;
                    ouchAudio.play().catch(err => console.log("Audio play prevented:", err));
                }
                
                clearTimeout(popTimer);
                mole.classList.remove('mole-up');
                mole.style.transform = 'translateY(100%)';
                currentMoleHole = null;

                // Harder scaling: shrinks faster every 5 whacs down to a blistering 350ms minimum floor
                const tier = Math.floor(score / 5);
                currentPopDuration = Math.max(350, 4000 - (tier * 350));

                clearTimeout(moleTimeout);
                const nextDelay = Math.max(250, 1400 - (tier * 100));
                moleTimeout = setTimeout(nextMoleLoop, nextDelay);
            };

            mole.addEventListener('click', handleWhack);
            mole.addEventListener('touchstart', handleWhack);

            hole.appendChild(mole);
            grid.appendChild(hole);
            holes.push({ hole, mole });
        }

        function randomHole() {
            const index = Math.floor(Math.random() * holes.length);
            if (index === lastHole) return randomHole();
            lastHole = index;
            return holes[index];
        }

        function popMole() {
            if (!isPlaying) return;

            const chosen = randomHole();
            const chosenIndex = holes.indexOf(chosen);
            currentMoleHole = chosenIndex;

            chosen.mole.style.transform = 'translateY(0%)';
            chosen.mole.classList.add('mole-up');

            popTimer = setTimeout(() => {
                if (isPlaying && currentMoleHole === chosenIndex) {
                    chosen.mole.classList.remove('mole-up');
                    chosen.mole.style.transform = 'translateY(100%)';
                    currentMoleHole = null;
                    loseLife();
                    if (isPlaying) {
                        nextMoleLoop();
                    }
                }
            }, currentPopDuration);
        }

        function loseLife() {
            if (!isPlaying) return;
            lives--;
            updateLivesDisplay();
            
            if (lives <= 0) {
                endGame();
            }
        }

        function updateLivesDisplay() {
            let hearts = "";
            for (let i = 0; i < lives; i++) hearts += "❤️";
            livesDisplay.textContent = hearts || "❌";
        }

        function nextMoleLoop() {
            if (!isPlaying) return;
            popMole();
        }

        function startGame() {
            initAudioBoost();
            score = 0;
            lives = 3;
            currentPopDuration = 4000;
            scoreDisplay.textContent = score;
            updateLivesDisplay();
            isPlaying = true;
            
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            startBtn.disabled = true;
            document.body.classList.add('hammer-active');
            submitSection.classList.remove('hidden');

            if (bgMusic) {
                bgMusic.currentTime = 0;
                bgMusic.play().catch(err => console.log("Background music play prevented:", err));
            }

            nextMoleLoop();
        }

        function endGame() {
            isPlaying = false;
            clearTimeout(popTimer);
            clearTimeout(moleTimeout);

            if (currentMoleHole !== null) {
                holes[currentMoleHole].mole.classList.remove('mole-up');
                holes[currentMoleHole].mole.style.transform = 'translateY(100%)';
                currentMoleHole = null;
            }

            if (bgMusic) {
                bgMusic.pause();
                bgMusic.currentTime = 0;
            }
            if (gameOverAudio) {
                gameOverAudio.currentTime = 0;
                gameOverAudio.play().catch(err => console.log("Game over audio play prevented:", err));
            }

            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            startBtn.disabled = false;
            document.body.classList.remove('hammer-active');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('whac_troy_arcade_highScore', highScore);
                highScoreDisplay.textContent = highScore;
                modalTitle.textContent = "🏆 NEW HIGH SCORE! 🏆";
            } else {
                modalTitle.textContent = "GAME OVER";
            }

            finalScoreText.textContent = `You whacked Troy ${score} times!`;
            modalOverlay.classList.remove('hidden');
            fetchLeaderboard();
        }

        async function fetchLeaderboard() {
            leaderboardList.innerHTML = `<div class="text-slate-400 text-center py-2">Loading scores...</div>`;
            if (!db) {
                leaderboardList.innerHTML = `<div class="text-yellow-400 text-center py-2">Offline mode</div>`;
                return;
            }
            try {
                const scoresRef = query(ref(db, 'leaderboard'), orderByChild('score'), limitToLast(10));
                const snapshot = await get(scoresRef);
                if (snapshot.exists()) {
                    let html = "";
                    let rank = 1;
                    const items = [];
                    snapshot.forEach((childSnapshot) => {
                        items.push(childSnapshot.val());
                    });
                    items.sort((a, b) => b.score - a.score);

                    items.forEach((entry) => {
                        html += `<div class="flex justify-between py-1 border-b border-slate-900 font-bold">
                            <span>#${rank} ${escapeHtml(entry.name)}</span>
                            <span class="text-green-400">${entry.score} pts</span>
                        </div>`;
                        rank++;
                    });
                    leaderboardList.innerHTML = html;
                } else {
                    leaderboardList.innerHTML = `<div class="text-slate-400 text-center py-2">No scores yet. Be the first!</div>`;
                }
            } catch (err) {
                leaderboardList.innerHTML = `<div class="text-red-400 text-center py-2">Failed to load leaderboard</div>`;
            }
        }

        submitScoreBtn.addEventListener('click', async () => {
            const name = playerNameInput.value.trim() || "Anonymous Troy Hater";
            if (!db) {
                alert("Database not connected!");
                return;
            }
            submitScoreBtn.disabled = true;
            submitScoreBtn.textContent = "SAVING...";
            try {
                const scoresRef = ref(db, 'leaderboard');
                await push(scoresRef, { name: name, score: score });
                submitSection.classList.add('hidden');
                fetchLeaderboard();
            } catch (err) {
                alert("Error saving score. Try again!");
                submitScoreBtn.disabled = false;
                submitScoreBtn.textContent = "SUBMIT TO GLOBAL LEADERBOARD";
            }
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        startBtn.addEventListener('click', startGame);
        modalBtn.addEventListener('click', () => {
            modalOverlay.classList.add('hidden');
            startGame();
        });
    </script>
</body>
</html>
