<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whac-A-Troy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, button, span, h1, p, input {
            font-family: 'Comic Sans MS', 'Comic Sans', cursive, sans-serif !important;
        }
        body {
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #09090b;
            min-height: 100vh;
        }
        .cabinet-shadow {
            box-shadow: 0 0 50px rgba(79, 70, 229, 0.4), inset 0 0 30px rgba(0, 0, 0, 0.8);
        }
        @keyframes popUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(0%); }
        }
        .mole-up {
            animation: popUp 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .hammer-active {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewport='0 0 100 100' style='fill:black;font-size:30px;'><text y='30'>🔨</text></svg>"), auto !important;
        }
        /* Glowing Golden Aura Effect */
        .golden-glow {
            border: 4px solid #facc15 !important;
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.9);
        }
        /* Bomb Glow Effect */
        .bomb-glow {
            border: 4px solid #ef4444 !important;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.9);
        }
    </style>
</head>
<body class="text-white flex flex-col items-center justify-center p-4">

    <!-- Main Arcade Cabinet Container -->
    <div class="w-full max-w-xl bg-slate-900/95 backdrop-blur-md border-4 border-indigo-500 rounded-3xl cabinet-shadow p-6 sm:p-8 flex flex-col items-center relative overflow-hidden">
        
        <!-- Top Arcade Marquee -->
        <div class="text-center mb-4 w-full border-b-2 border-indigo-500/40 pb-4">
            <h1 class="text-2xl sm:text-3xl text-yellow-400 font-extrabold tracking-wider drop-shadow-[0_2px_10px_rgba(234,179,8,0.5)]">
                WHAC-A-TROY
            </h1>
        </div>

        <!-- Scoreboard / HUD (Score, Lives, High Score) -->
        <div class="grid grid-cols-3 gap-2 sm:gap-4 w-full mb-6 text-center">
            <div class="bg-slate-800 border-2 border-slate-700 rounded-xl p-3 shadow-inner">
                <span class="block text-xs text-slate-400 uppercase mb-1">Score</span>
                <span id="scoreDisplay" class="text-xl sm:text-2xl text-green-400 font-bold">0</span>
            </div>
            <div class="bg-slate-800 border-2 border-slate-700 rounded-xl p-3 shadow-inner">
                <span class="block text-xs text-slate-400 uppercase mb-1">Lives</span>
                <span id="livesDisplay" class="text-xl sm:text-2xl text-red-500 font-bold">❤️❤️❤️</span>
            </div>
            <div class="bg-slate-800 border-2 border-slate-700 rounded-xl p-3 shadow-inner">
                <span class="block text-xs text-slate-400 uppercase mb-1">High Score</span>
                <span id="highScoreDisplay" class="text-xl sm:text-2xl text-purple-400 font-bold">0</span>
            </div>
        </div>

        <!-- Audio Elements -->
        <audio id="ouchAudio" src="ouch.mp3" preload="auto"></audio>
        <audio id="bgMusic" src="bg.mp3" loop preload="auto"></audio>
        <audio id="gameOverAudio" src="igyo.mp3" preload="auto"></audio>

        <!-- Game Grid (3x3 Holes) with bg2.png background -->
        <div id="gameGrid" class="grid grid-cols-3 gap-3 sm:gap-4 w-full max-w-md aspect-square p-4 rounded-2xl border-4 border-slate-800 shadow-2xl relative bg-cover bg-center" style="background-image: url('bg2.png'); background-color: #020617;">
            <!-- 9 Holes generated via JS -->
        </div>

        <!-- Controls & Bottom Buttons -->
        <div id="gameControlsContainer" class="mt-6 w-full max-w-md flex flex-col items-center">
            <!-- Game is controlled via modals -->
        </div>

        <!-- HOME SCREEN MODAL (Reverted Text) -->
        <div id="homeModal" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center p-6 z-50 text-center">
            <div class="bg-slate-900 border-2 border-indigo-500 p-8 rounded-3xl max-w-md w-full shadow-2xl flex flex-col gap-5 items-center">
                <h2 class="text-2xl sm:text-3xl text-yellow-400 font-extrabold tracking-wide">WELCOME!</h2>
                <p class="text-slate-300 text-sm">Whac Troy before he escapes back down his hole!</p>
                <div class="w-full flex flex-col gap-3 mt-2">
                    <button id="homePlayBtn" class="w-full py-4 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-extrabold text-base sm:text-lg rounded-xl shadow-lg transform active:scale-95 transition-all duration-150 border-b-4 border-amber-800 cursor-pointer">
                        PLAY GAME
                    </button>
                    <button id="homeLeaderboardBtn" class="w-full py-3.5 bg-purple-600 hover:bg-purple-500 text-white font-extrabold text-sm sm:text-base rounded-xl shadow-md transition-all border-b-4 border-purple-800 cursor-pointer">
                        VIEW LEADERBOARDS
                    </button>
                </div>
            </div>
        </div>

        <!-- DIFFICULTY SELECTION MODAL -->
        <div id="difficultyModal" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md hidden flex flex-col items-center justify-center p-6 z-50 text-center">
            <div class="bg-slate-900 border-2 border-indigo-500 p-6 rounded-2xl max-w-sm w-full shadow-2xl flex flex-col gap-4">
                <h3 class="text-xl sm:text-2xl text-yellow-400 font-bold">CHOOSE DIFFICULTY</h3>
                <button id="normalDiffBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-extrabold rounded-xl text-base transition-all shadow-md cursor-pointer border-b-4 border-blue-800">
                    NORMAL MODE
                </button>
                <button id="hardDiffBtn" class="w-full py-3 bg-red-600 hover:bg-red-500 text-white font-extrabold rounded-xl text-base transition-all shadow-md cursor-pointer border-b-4 border-red-800">
                    HARD MODE 🔥
                </button>
                <button id="diffBackHomeBtn" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-sm transition-all shadow-md cursor-pointer border-b-2 border-slate-950 mt-1">
                    ← Back to Home
                </button>
            </div>
        </div>

        <!-- SIDE-BY-SIDE LEADERBOARDS MODAL -->
        <div id="leaderboardModal" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md hidden flex flex-col items-center justify-center p-4 z-50 text-center">
            <div class="bg-slate-900 border-2 border-indigo-500 p-6 rounded-2xl max-w-2xl w-full shadow-2xl flex flex-col gap-4 my-auto">
                <h3 class="text-xl sm:text-2xl text-yellow-400 font-bold">🌍 GLOBAL LEADERBOARDS</h3>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-left">
                    <div class="bg-slate-950 border border-blue-500/40 rounded-xl p-3 flex flex-col">
                        <div class="flex justify-between text-xs text-blue-400 font-extrabold uppercase tracking-wider mb-2 px-1">
                            <span>NORMAL MODE</span>
                            <span>PTS</span>
                        </div>
                        <div id="lbNormalList" class="max-h-72 overflow-y-auto space-y-1 text-xs sm:text-sm">
                            <div class="text-slate-500 text-center py-4">Loading...</div>
                        </div>
                    </div>
                    <div class="bg-slate-950 border border-red-500/40 rounded-xl p-3 flex flex-col">
                        <div class="flex justify-between text-xs text-red-400 font-extrabold uppercase tracking-wider mb-2 px-1">
                            <span>HARD MODE 🔥</span>
                            <span>PTS</span>
                        </div>
                        <div id="lbHardList" class="max-h-72 overflow-y-auto space-y-1 text-xs sm:text-sm">
                            <div class="text-slate-500 text-center py-4">Loading...</div>
                        </div>
                    </div>
                </div>

                <button id="closeLeaderboardModalBtn" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-sm transition-all shadow-md cursor-pointer border-b-2 border-slate-950">
                    ← Back to Home
                </button>
            </div>
        </div>

        <!-- GAME OVER MODAL -->
        <div id="modalOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md hidden flex flex-col items-center justify-center p-6 z-50 text-center overflow-y-auto">
            <div class="bg-slate-900 border-2 border-indigo-500 p-6 rounded-2xl max-w-md w-full shadow-2xl my-auto">
                <h3 id="modalTitle" class="text-xl sm:text-2xl text-yellow-400 mb-2 font-bold">GAME OVER</h3>
                <p id="finalScoreText" class="text-slate-200 text-base mb-4 font-semibold">You whacked Troy 0 times!</p>
                
                <div id="submitSection" class="mb-5 flex flex-col gap-3">
                    <input type="text" id="playerNameInput" placeholder="Enter Your Name" maxlength="15" class="w-full px-4 py-3 bg-slate-800 border-2 border-slate-700 rounded-xl text-white text-center focus:outline-none focus:border-yellow-400 font-bold" />
                    <button id="submitScoreBtn" class="w-full py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded-xl text-sm transition-all shadow-md cursor-pointer">
                        SUBMIT TO GLOBAL LEADERBOARD
                    </button>
                </div>

                <div class="mb-5">
                    <div class="flex justify-between text-xs text-yellow-400 uppercase tracking-wider mb-2 font-bold px-1">
                        <span id="leaderboardTitle">🌍 GLOBAL TOP 10 (NORMAL)</span>
                        <span>PTS</span>
                    </div>
                    <div id="leaderboardList" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-left text-xs sm:text-sm max-h-36 overflow-y-auto space-y-1">
                        <div class="text-slate-400 text-center py-2">Loading leaderboard...</div>
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <button id="modalPlayAgainBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-sm transition-all shadow-md cursor-pointer">
                        PLAY AGAIN
                    </button>
                    <button id="modalHomeBtn" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-sm transition-all shadow-md cursor-pointer border-b-2 border-slate-950">
                        🏠 Back to Home
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase SDK & Game Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD6jWFraCDGLyYBlxMzWa3JcmMZSYpHghI",
            authDomain: "whacatroyleaderboard.firebaseapp.com",
            databaseURL: "https://whacatroyleaderboard-default-rtdb.firebaseio.com",
            projectId: "whacatroyleaderboard",
            storageBucket: "whacatroyleaderboard.firebasestorage.app",
            messagingSenderId: "562825000747",
            appId: "1:562825000747:web:b4c084f7dbce160767776e",
            measurementId: "G-EJ7RL3NHBB"
        };

        let db = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
        } catch (e) {
            console.log("Database connection error:", e);
        }

        let audioCtx = null;
        let gameOverGain = null;
        function initAudioBoost() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const source = audioCtx.createMediaElementSource(gameOverAudio);
                    gameOverGain = audioCtx.createGain();
                    gameOverGain.gain.value = 5.0;
                    source.connect(gameOverGain);
                    gameOverGain.connect(audioCtx.destination);
                } catch (e) {
                    console.log("Web Audio API boost fallback:", e);
                }
            } else if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        const grid = document.getElementById('gameGrid');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        
        const homeModal = document.getElementById('homeModal');
        const homePlayBtn = document.getElementById('homePlayBtn');
        const homeLeaderboardBtn = document.getElementById('homeLeaderboardBtn');
        const difficultyModal = document.getElementById('difficultyModal');
        const normalDiffBtn = document.getElementById('normalDiffBtn');
        const hardDiffBtn = document.getElementById('hardDiffBtn');
        const diffBackHomeBtn = document.getElementById('diffBackHomeBtn');
        const leaderboardModal = document.getElementById('leaderboardModal');
        const closeLeaderboardModalBtn = document.getElementById('closeLeaderboardModalBtn');
        const lbNormalList = document.getElementById('lbNormalList');
        const lbHardList = document.getElementById('lbHardList');
        
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const finalScoreText = document.getElementById('finalScoreText');
        const modalPlayAgainBtn = document.getElementById('modalPlayAgainBtn');
        const modalHomeBtn = document.getElementById('modalHomeBtn');
        const playerNameInput = document.getElementById('playerNameInput');
        const submitScoreBtn = document.getElementById('submitScoreBtn');
        const leaderboardList = document.getElementById('leaderboardList');
        const leaderboardTitle = document.getElementById('leaderboardTitle');
        const submitSection = document.getElementById('submitSection');
        
        const bgMusic = document.getElementById('bgMusic');
        const gameOverAudio = document.getElementById('gameOverAudio');

        let score = 0;
        let lives = 3;
        let isPlaying = false;
        let lastHole = null;
        let currentMoleHole = null;
        let popTimer = null;
        let moleTimeout = null;
        let currentDifficulty = 'normal';
        let currentPopDuration = 5000;
        let currentMoleType = 'normal';

        function updateHighScoreDisplay() {
            const savedHighScore = localStorage.getItem(`whac_troy_highScore_${currentDifficulty}`) || 0;
            highScoreDisplay.textContent = savedHighScore;
        }
        updateHighScoreDisplay();

        const holes = [];
        for (let i = 0; i < 9; i++) {
            const hole = document.createElement('div');
            hole.classList.add('relative', 'bg-slate-900/60', 'backdrop-blur-xs', 'rounded-2xl', 'overflow-hidden', 'border-4', 'border-slate-800/80', 'flex', 'items-end', 'justify-center', 'cursor-pointer', 'shadow-inner');
            
            const mole = document.createElement('div');
            mole.classList.add('w-20', 'h-20', 'sm:w-24', 'sm:h-24', 'absolute', 'bottom-0', 'transform', 'translate-y-full', 'transition-transform', 'duration-150', 'flex', 'items-center', 'justify-center', 'z-20');
            
            const troyFace = document.createElement('div');
            troyFace.className = 'w-full h-full flex items-center justify-center overflow-hidden rounded-full shadow-2xl bg-slate-800';
            troyFace.innerHTML = `<img src="troy.png" class="w-full h-full object-cover rounded-full mole-img" alt="Troy" onerror="this.onerror=null; this.src='https://placehold.co/100x100/1e293b/facc15?text=Troy';" />`;
            
            mole.appendChild(troyFace);

            const handleWhack = (e) => {
                e.preventDefault();
                if (!isPlaying || currentMoleHole !== i) return;
                
                if (currentMoleType === 'gold') {
                    score += 5;
                } else if (currentMoleType === 'bomb') {
                    score = Math.max(0, score - 5);
                    lives--;
                    updateLivesDisplay();
                } else {
                    score += 1;
                }

                scoreDisplay.textContent = score;
                
                const ouchAudio = document.getElementById('ouchAudio');
                if (ouchAudio) {
                    ouchAudio.currentTime = 0;
                    ouchAudio.play().catch(err => console.log("Audio play prevented:", err));
                }
                
                clearTimeout(popTimer);
                mole.classList.remove('mole-up');
                mole.style.transform = 'translateY(100%)';
                troyFace.classList.remove('golden-glow', 'bomb-glow');
                currentMoleHole = null;
                currentMoleType = 'normal';

                if (lives <= 0) {
                    endGame();
                    return;
                }

                const tier = Math.floor(score / 5);
                if (currentDifficulty === 'hard') {
                    currentPopDuration = Math.max(350, 4000 - (tier * 350));
                } else {
                    currentPopDuration = Math.max(800, 5000 - (tier * 300));
                }

                clearTimeout(moleTimeout);
                const nextDelay = currentDifficulty === 'hard' 
                    ? Math.max(250, 1400 - (tier * 100))
                    : Math.max(600, 1800 - (tier * 120));
                moleTimeout = setTimeout(nextMoleLoop, nextDelay);
            };

            mole.addEventListener('click', handleWhack);
            mole.addEventListener('touchstart', handleWhack);

            hole.appendChild(mole);
            grid.appendChild(hole);
            holes.push({ hole, mole, troyFace });
        }

        function randomHole() {
            const index = Math.floor(Math.random() * holes.length);
            if (index === lastHole) return randomHole();
            lastHole = index;
            return holes[index];
        }

        function popMole() {
            if (!isPlaying) return;

            const chosen = randomHole();
            const chosenIndex = holes.indexOf(chosen);
            currentMoleHole = chosenIndex;

            const imgTag = chosen.troyFace.querySelector('.mole-img');
            chosen.troyFace.classList.remove('golden-glow', 'bomb-glow');

            const rand = Math.random();
            if (rand < 0.05) {
                currentMoleType = 'gold';
                imgTag.src = 'goldtroy.png';
                chosen.troyFace.classList.add('golden-glow');
            } else if (rand < 0.15) {
                currentMoleType = 'bomb';
                imgTag.src = 'bombtroy.png';
                chosen.troyFace.classList.add('bomb-glow');
            } else {
                currentMoleType = 'normal';
                imgTag.src = 'troy.png';
            }

            chosen.mole.style.transform = 'translateY(0%)';
            chosen.mole.classList.add('mole-up');

            popTimer = setTimeout(() => {
                if (isPlaying && currentMoleHole === chosenIndex) {
                    chosen.mole.classList.remove('mole-up');
                    chosen.mole.style.transform = 'translateY(100%)';
                    chosen.troyFace.classList.remove('golden-glow', 'bomb-glow');
                    currentMoleHole = null;
                    
                    if (currentMoleType !== 'bomb') {
                        loseLife();
                    } else {
                        currentMoleType = 'normal';
                        if (isPlaying) nextMoleLoop();
                    }
                }
            }, currentPopDuration);
        }

        function loseLife() {
            if (!isPlaying) return;
            lives--;
            updateLivesDisplay();
            
            if (lives <= 0) {
                endGame();
            } else if (isPlaying) {
                nextMoleLoop();
            }
        }

        function updateLivesDisplay() {
            let hearts = "";
            for (let i = 0; i < lives; i++) hearts += "❤️";
            livesDisplay.textContent = hearts || "❌";
        }

        function nextMoleLoop() {
            if (!isPlaying) return;
            popMole();
        }

        homePlayBtn.addEventListener('click', () => {
            homeModal.classList.add('hidden');
            difficultyModal.classList.remove('hidden');
        });

        homeLeaderboardBtn.addEventListener('click', () => {
            homeModal.classList.add('hidden');
            fetchAllSideBySideLeaderboards();
            leaderboardModal.classList.remove('hidden');
        });

        diffBackHomeBtn.addEventListener('click', () => {
            difficultyModal.classList.add('hidden');
            homeModal.classList.remove('hidden');
        });

        closeLeaderboardModalBtn.addEventListener('click', () => {
            leaderboardModal.classList.add('hidden');
            homeModal.classList.remove('hidden');
        });

        normalDiffBtn.addEventListener('click', () => {
            difficultyModal.classList.add('hidden');
            startGame('normal');
        });

        hardDiffBtn.addEventListener('click', () => {
            difficultyModal.classList.add('hidden');
            startGame('hard');
        });

        modalPlayAgainBtn.addEventListener('click', () => {
            modalOverlay.classList.add('hidden');
            difficultyModal.classList.remove('hidden');
        });

        modalHomeBtn.addEventListener('click', () => {
            modalOverlay.classList.add('hidden');
            homeModal.classList.remove('hidden');
        });

        function startGame(difficulty) {
            initAudioBoost();
            currentDifficulty = difficulty;
            updateHighScoreDisplay();
            score = 0;
            lives = 3;
            currentPopDuration = (currentDifficulty === 'hard') ? 4000 : 5000;
            scoreDisplay.textContent = score;
            updateLivesDisplay();
            isPlaying = true;
            
            document.body.classList.add('hammer-active');
            submitSection.classList.remove('hidden');

            if (bgMusic) {
                bgMusic.currentTime = 0;
                bgMusic.play().catch(err => console.log("Background music play prevented:", err));
            }

            nextMoleLoop();
        }

        function endGame() {
            isPlaying = false;
            clearTimeout(popTimer);
            clearTimeout(moleTimeout);

            if (currentMoleHole !== null) {
                holes[currentMoleHole].mole.classList.remove('mole-up');
                holes[currentMoleHole].mole.style.transform = 'translateY(100%)';
                holes[currentMoleHole].troyFace.classList.remove('golden-glow', 'bomb-glow');
                currentMoleHole = null;
                currentMoleType = 'normal';
            }

            if (bgMusic) {
                bgMusic.pause();
                bgMusic.currentTime = 0;
            }
            if (gameOverAudio) {
                gameOverAudio.currentTime = 0;
                gameOverAudio.play().catch(err => console.log("Game over audio play prevented:", err));
            }

            document.body.classList.remove('hammer-active');

            const currentHighScore = localStorage.getItem(`whac_troy_highScore_${currentDifficulty}`) || 0;
            if (score > currentHighScore) {
                localStorage.setItem(`whac_troy_highScore_${currentDifficulty}`, score);
                highScoreDisplay.textContent = score;
                modalTitle.textContent = "🏆 NEW HIGH SCORE! 🏆";
            } else {
                modalTitle.textContent = "GAME OVER";
            }

            finalScoreText.textContent = `You whacked Troy ${score} times on ${currentDifficulty.toUpperCase()} mode!`;
            leaderboardTitle.textContent = `🌍 GLOBAL TOP 10 (${currentDifficulty.toUpperCase()})`;
            modalOverlay.classList.remove('hidden');
            fetchClientSideLeaderboard(currentDifficulty, leaderboardList);
        }

        async function fetchClientSideLeaderboard(difficulty, targetElement) {
            targetElement.innerHTML = `<div class="text-slate-400 text-center py-2">Loading scores...</div>`;
            if (!db) {
                targetElement.innerHTML = `<div class="text-yellow-400 text-center py-2">Offline mode</div>`;
                return;
            }
            try {
                const snapshot = await get(ref(db, `leaderboard/${difficulty}`));
                if (snapshot.exists()) {
                    let html = "";
                    const items = [];
                    snapshot.forEach((childSnapshot) => {
                        const val = childSnapshot.val();
                        if (val && typeof val.score === 'number') {
                            items.push(val);
                        }
                    });
                    items.sort((a, b) => b.score - a.score);
                    const top10 = items.slice(0, 10);

                    top10.forEach((entry, index) => {
                        html += `<div class="flex justify-between items-center py-1 border-b border-slate-900 font-bold text-xs sm:text-sm">
                            <span class="truncate pr-2">#${index + 1} ${escapeHtml(entry.name || 'Anonymous')}</span>
                            <span class="text-green-400 whitespace-nowrap">${entry.score} pts</span>
                        </div>`;
                    });
                    targetElement.innerHTML = html;
                } else {
                    targetElement.innerHTML = `<div class="text-slate-400 text-center py-2">No scores yet. Be the first!</div>`;
                }
            } catch (err) {
                targetElement.innerHTML = `<div class="text-red-400 text-center py-2">Failed to load leaderboard</div>`;
            }
        }

        async function fetchAllSideBySideLeaderboards() {
            lbNormalList.innerHTML = `<div class="text-slate-500 text-center py-4">Loading...</div>`;
            lbHardList.innerHTML = `<div class="text-slate-500 text-center py-4">Loading...</div>`;
            
            if (!db) {
                lbNormalList.innerHTML = `<div class="text-yellow-400 text-center py-2">Offline mode</div>`;
                lbHardList.innerHTML = `<div class="text-yellow-400 text-center py-2">Offline mode</div>`;
                return;
            }

            try {
                const normalSnap = await get(ref(db, 'leaderboard/normal'));
                if (normalSnap.exists()) {
                    let html = "";
                    const items = [];
                    normalSnap.forEach(c => {
                        const val = c.val();
                        if (val && typeof val.score === 'number') items.push(val);
                    });
                    items.sort((a, b) => b.score - a.score);
                    const top10 = items.slice(0, 10);

                    top10.forEach((entry, index) => {
                        html += `<div class="flex justify-between items-center py-0.5 border-b border-slate-900 font-bold text-[11px] sm:text-xs">
                            <span class="truncate pr-1">#${index + 1} ${escapeHtml(entry.name || 'Anonymous')}</span>
                            <span class="text-green-400 whitespace-nowrap">${entry.score} pts</span>
                        </div>`;
                    });
                    lbNormalList.innerHTML = html;
                } else {
                    lbNormalList.innerHTML = `<div class="text-slate-500 text-center py-4">No scores yet.</div>`;
                }
            } catch (e) {
                lbNormalList.innerHTML = `<div class="text-red-400 text-center py-4">Error loading</div>`;
            }

            try {
                const hardSnap = await get(ref(db, 'leaderboard/hard'));
                if (hardSnap.exists()) {
                    let html = "";
                    const items = [];
                    hardSnap.forEach(c => {
                        const val = c.val();
                        if (val && typeof val.score === 'number') items.push(val);
                    });
                    items.sort((a, b) => b.score - a.score);
                    const top10 = items.slice(0, 10);

                    top10.forEach((entry, index) => {
                        html += `<div class="flex justify-between items-center py-0.5 border-b border-slate-900 font-bold text-[11px] sm:text-xs">
                            <span class="truncate pr-1">#${index + 1} ${escapeHtml(entry.name || 'Anonymous')}</span>
                            <span class="text-green-400 whitespace-nowrap">${entry.score} pts</span>
                        </div>`;
                    });
                    lbHardList.innerHTML = html;
                } else {
                    lbHardList.innerHTML = `<div class="text-slate-500 text-center py-4">No scores yet.</div>`;
                }
            } catch (e) {
                lbHardList.innerHTML = `<div class="text-red-400 text-center py-4">Error loading</div>`;
            }
        }

        submitScoreBtn.addEventListener('click', async () => {
            const name = playerNameInput.value.trim() || "Anonymous Troy Hater";
            if (!db) {
                alert("Database not connected!");
                return;
            }
            submitScoreBtn.disabled = true;
            submitScoreBtn.textContent = "SAVING...";
            try {
                const scoresRef = ref(db, `leaderboard/${currentDifficulty}`);
                await push(scoresRef, { name: name, score: score });
                submitSection.classList.add('hidden');
                fetchClientSideLeaderboard(currentDifficulty, leaderboardList);
            } catch (err) {
                alert("Error saving score. Try again!");
                submitScoreBtn.disabled = false;
                submitScoreBtn.textContent = "SUBMIT TO GLOBAL LEADERBOARD";
            }
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
