<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whac-A-Troy Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, button, span, h1, p {
            font-family: 'Comic Sans MS', 'Comic Sans', cursive, sans-serif !important;
        }
        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #09090b 100%);
            min-height: 100vh;
        }
        .cabinet-shadow {
            box-shadow: 0 0 50px rgba(79, 70, 229, 0.4), inset 0 0 30px rgba(0, 0, 0, 0.8);
        }
        /* Mole pop animation */
        @keyframes popUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(0%); }
        }
        .mole-up {
            animation: popUp 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        /* Custom hammer cursor when active */
        .hammer-active {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewport='0 0 100 100' style='fill:black;font-size:30px;'><text y='30'>🔨</text></svg>"), auto !important;
        }
    </style>
</head>
<body class="text-white flex flex-col items-center justify-center p-4">

    <!-- Main Arcade Cabinet Container -->
    <div class="w-full max-w-xl bg-slate-900 border-4 border-indigo-500 rounded-3xl cabinet-shadow p-6 sm:p-8 flex flex-col items-center relative overflow-hidden">
        
        <!-- Top Arcade Marquee -->
        <div class="text-center mb-4 w-full border-b-2 border-indigo-500/40 pb-4">
            <h1 class="text-2xl sm:text-3xl text-yellow-400 font-extrabold tracking-wider drop-shadow-[0_2px_10px_rgba(234,179,8,0.5)]">
                WHAC-A-TROY
            </h1>
        </div>

        <!-- Scoreboard / HUD -->
        <div class="grid grid-cols-3 gap-2 sm:gap-4 w-full mb-6 text-center">
            <div class="bg-slate-800 border-2 border-slate-700 rounded-xl p-3 shadow-inner">
                <span class="block text-xs text-slate-400 uppercase mb-1">Score</span>
                <span id="scoreDisplay" class="text-xl sm:text-2xl text-green-400 font-bold">0</span>
            </div>
            <div class="bg-slate-800 border-2 border-slate-700 rounded-xl p-3 shadow-inner">
                <span class="block text-xs text-slate-400 uppercase mb-1">Time</span>
                <span id="timerDisplay" class="text-xl sm:text-2xl text-yellow-400 font-bold">30</span>
            </div>
            <div class="bg-slate-800 border-2 border-slate-700 rounded-xl p-3 shadow-inner">
                <span class="block text-xs text-slate-400 uppercase mb-1">High Score</span>
                <span id="highScoreDisplay" class="text-xl sm:text-2xl text-purple-400 font-bold">0</span>
            </div>
        </div>

        <!-- Game Grid (3x3 Holes) -->
        <div id="gameGrid" class="grid grid-cols-3 gap-3 sm:gap-4 w-full max-w-md aspect-square bg-slate-950 p-4 rounded-2xl border-4 border-slate-800 shadow-2xl relative">
            <!-- 9 Holes will be generated via JavaScript -->
        </div>

        <!-- Controls & Start Overlay / Buttons -->
        <div class="mt-6 w-full flex flex-col items-center gap-3">
            <button id="startBtn" class="w-full py-4 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-extrabold text-base sm:text-lg rounded-xl shadow-lg transform active:scale-95 transition-all duration-150 border-b-4 border-amber-800">
                START GAME
            </button>
        </div>

        <!-- Custom Notification / Message Box -->
        <div id="modalOverlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex flex-col items-center justify-center p-6 z-50 text-center">
            <div class="bg-slate-900 border-2 border-indigo-500 p-6 rounded-2xl max-w-sm w-full shadow-2xl">
                <h3 id="modalTitle" class="text-lg sm:text-xl text-yellow-400 mb-3 font-bold">GAME OVER</h3>
                <p id="modalMessage" class="text-slate-300 text-sm mb-6">Great job! You whacked Troy 14 times.</p>
                <button id="modalBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-sm transition-all shadow-md">
                    PLAY AGAIN
                </button>
            </div>
        </div>

    </div>

    <script>
        // Game State Variables
        const grid = document.getElementById('gameGrid');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const startBtn = document.getElementById('startBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalBtn = document.getElementById('modalBtn');

        let score = 0;
        let timeLeft = 30;
        let gameInterval = null;
        let moleInterval = null;
        let isPlaying = false;
        let lastHole = null;
        let currentMoleHole = null;
        let popDuration = 1800; // Increased starting time mole stays up (ms)

        // Load High Score from Local Storage
        let highScore = localStorage.getItem('whac_troy_highScore') || 0;
        highScoreDisplay.textContent = highScore;

        // Initialize 9 holes
        const holes = [];
        for (let i = 0; i < 9; i++) {
            const hole = document.createElement('div');
            hole.classList.add('relative', 'bg-slate-900', 'rounded-2xl', 'overflow-hidden', 'border-4', 'border-slate-800', 'flex', 'items-end', 'justify-center', 'cursor-pointer', 'shadow-inner');
            
            // Inner dirt pit
            const pit = document.createElement('div');
            pit.classList.add('absolute', 'bottom-0', 'w-full', 'h-1/2', 'bg-amber-950', 'rounded-t-full', 'border-t-4', 'border-amber-900', 'flex', 'items-center', 'justify-center', 'z-10');
            
            // Mole Element representing Troy
            const mole = document.createElement('div');
            mole.classList.add('w-20', 'h-20', 'sm:w-24', 'sm:h-24', 'absolute', 'bottom-0', 'transform', 'translate-y-full', 'transition-transform', 'duration-75', 'flex', 'items-center', 'justify-center', 'z-20');
            
            const troyFace = document.createElement('div');
            troyFace.classList.add('w-full', 'h-full', 'flex', 'items-center', 'justify-center', 'overflow-hidden', 'rounded-full', 'border-4', 'border-yellow-400', 'shadow-2xl', 'bg-slate-800');
            
            // Load Troy's image directly from the same GitHub repository folder as index.html
            troyFace.innerHTML = `<img src="troy.png" class="w-full h-full object-cover rounded-full" alt="Troy" onerror="this.onerror=null; this.src='https://placehold.co/100x100/1e293b/facc15?text=Troy';" />`;
            
            mole.appendChild(troyFace);

            // Whack event listener
            mole.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!isPlaying || currentMoleHole !== i) return;
                
                score++;
                scoreDisplay.textContent = score;
                
                // Hide mole immediately on whack
                mole.classList.remove('mole-up');
                mole.style.transform = 'translateY(100%)';
                currentMoleHole = null;
                
                // Speed up difficulty slightly as score increases (keeping min duration higher so it's not too fast)
                if (popDuration > 800) {
                    popDuration = Math.max(800, 1800 - (score * 30));
                }
            });

            hole.appendChild(pit);
            hole.appendChild(mole);
            grid.appendChild(hole);

            holes.push({ hole, mole });
        }

        function randomHole() {
            const index = Math.floor(Math.random() * holes.length);
            if (index === lastHole) {
                return randomHole();
            }
            lastHole = index;
            return holes[index];
        }

        function popMole() {
            if (!isPlaying) return;

            // Hide previous mole if active
            if (currentMoleHole !== null) {
                holes[currentMoleHole].mole.classList.remove('mole-up');
                holes[currentMoleHole].mole.style.transform = 'translateY(100%)';
                currentMoleHole = null;
            }

            const chosen = randomHole();
            // Find index of chosen hole
            const chosenIndex = holes.indexOf(chosen);
            currentMoleHole = chosenIndex;

            chosen.mole.style.transform = 'translateY(0%)';
            chosen.mole.classList.add('mole-up');

            // Hide mole after popDuration
            setTimeout(() => {
                if (isPlaying && currentMoleHole === chosenIndex) {
                    chosen.mole.classList.remove('mole-up');
                    chosen.mole.style.transform = 'translateY(100%)';
                    currentMoleHole = null;
                }
            }, popDuration);
        }

        function startGame() {
            // Reset state
            score = 0;
            timeLeft = 30;
            popDuration = 1800;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            isPlaying = true;
            
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            startBtn.disabled = true;
            document.body.classList.add('hammer-active');

            // Timer countdown
            gameInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Mole pop loop with more breathing room between pops
            const runMoles = () => {
                if (!isPlaying) return;
                popMole();
                // Random interval between pops (giving more time to react)
                const nextTime = Math.random() * 600 + popDuration;
                moleInterval = setTimeout(runMoles, nextTime);
            };
            runMoles();
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearTimeout(moleInterval);

            // Hide any active mole
            if (currentMoleHole !== null) {
                holes[currentMoleHole].mole.classList.remove('mole-up');
                holes[currentMoleHole].mole.style.transform = 'translateY(100%)';
                currentMoleHole = null;
            }

            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            startBtn.disabled = false;
            document.body.classList.remove('hammer-active');

            // Check high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('whac_troy_highScore', highScore);
                highScoreDisplay.textContent = highScore;
                modalTitle.textContent = "NEW HIGH SCORE!";
            } else {
                modalTitle.textContent = "GAME OVER";
            }

            modalMessage.textContent = `Great job! You whacked Troy ${score} times.`;
            modalOverlay.classList.remove('hidden');
        }

        // Event Listeners
        startBtn.addEventListener('click', startGame);
        modalBtn.addEventListener('click', () => {
            modalOverlay.classList.add('hidden');
            startGame();
        });
    </script>
</body>
</html>
